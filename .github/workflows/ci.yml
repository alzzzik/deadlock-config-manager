# Runs the same checks as the release workflow on every push and pull request, so a broken commit
# shows up before a version tag is made.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Type-check UI
        run: npx tsc --noEmit

      - name: UI tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
