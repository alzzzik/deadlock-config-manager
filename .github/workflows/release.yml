# Builds the Windows installer when a version tag (v0.1.0, v0.2.0, …) is pushed,
# runs the tests first, and attaches the installer to a draft GitHub release.
# The draft also gets latest.json (read by the in-app updater once the release is published),
# a SHA256SUMS.txt file and a build attestation that proves the installer came from this workflow.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    # Releases are only made from version tags (a manual run from a branch would name a release after it).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Type-check UI
        run: npx tsc --noEmit

      - name: UI tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # What changed: the tag message's lines after its first (e.g. "- Faster Performance view"). They head
      # the release notes, and the app's update bar lists the "- " lines.
      - name: Release notes from the tag message
        id: notes
        shell: bash
        run: |
          git fetch --force --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          {
            echo 'text<<END_OF_NOTES'
            git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME"
            echo 'END_OF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Build installer and draft release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files. Without these secrets the build fails on purpose,
          # because installed copies would refuse an unsigned update anyway.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Deadlock Config Manager ${{ github.ref_name }}
          releaseBody: |
            ${{ steps.notes.outputs.text }}

            Download **Deadlock.Config.Manager_*_x64-setup.exe** and run it. Copies from v0.3.0 on update themselves. The portable zip runs without installing and doesn't update itself.

            If Windows says "Windows protected your PC", click **More info → Run anyway** (the app isn't code-signed).

            To check the download: `Get-FileHash <file>` should match `SHA256SUMS.txt`, or run `gh attestation verify <file> --repo alzzzik/deadlock-config-manager`.

            [Code signing policy](https://github.com/alzzzik/deadlock-config-manager#code-signing-policy) · [Privacy policy](https://github.com/alzzzik/deadlock-config-manager#privacy-policy)
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # Portable zip of the same exe, used by the Scoop bucket (bucket/ in this repo).
      - name: Portable zip
        id: portable
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $zip = "Deadlock.Config.Manager_${version}_x64_portable.zip"
          Compress-Archive -Path src-tauri/target/release/deadlock-config-manager.exe -DestinationPath $zip
          "zip=$((Resolve-Path $zip).Path)" >> $env:GITHUB_OUTPUT

      - name: Checksums
        id: sums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *-setup.exe) + @(Get-Item "${{ steps.portable.outputs.zip }}")
          $lines = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          "installer=$($files[0].FullName)" >> $env:GITHUB_OUTPUT

      # Clean-machine check of the installer: silent install, launch, uninstall entry, silent uninstall.
      - name: Install test
        shell: pwsh
        run: |
          $setup = "${{ steps.sums.outputs.installer }}"
          Start-Process -FilePath $setup -ArgumentList "/S" -Wait
          $exe = Join-Path $env:LOCALAPPDATA "Deadlock Config Manager\deadlock-config-manager.exe"
          if (-not (Test-Path $exe)) { throw "Not installed at $exe" }
          $key = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall |
            Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -eq "Deadlock Config Manager" }
          if (-not $key) { throw "No uninstall entry" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "The app exited right after starting (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          $uninstaller = (Get-ItemProperty $key.PSPath).UninstallString.Trim('"')
          Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait
          # NSIS uninstallers copy themselves to %TEMP% and return early; wait for the files to go.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $exe) { throw "Still installed after uninstall" }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ steps.sums.outputs.installer }}
            ${{ steps.portable.outputs.zip }}

      - name: Attach checksums and portable zip to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" SHA256SUMS.txt "${{ steps.portable.outputs.zip }}" --clobber
