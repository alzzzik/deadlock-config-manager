# Runs when a release is published (not while it's a draft) and updates the package managers:
# - Scoop: rewrites bucket/deadlock-config-manager.json with the new version and hash.
# - winget: opens a pull request on microsoft/winget-pkgs. Needs the WINGET_TOKEN secret (a classic
#   PAT with public_repo) and a first version submitted by hand; skipped until that secret exists.
name: Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (e.g. v0.3.0)
        required: true

permissions:
  contents: write

jobs:
  scoop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update the Scoop manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $version = $env:TAG.TrimStart("v")
          $zip = "Deadlock.Config.Manager_${version}_x64_portable.zip"
          gh release download $env:TAG --pattern SHA256SUMS.txt --dir .
          $hash = (Get-Content SHA256SUMS.txt | Where-Object { $_ -like "*  $zip" }) -split "\s+" | Select-Object -First 1
          if (-not $hash) { throw "No checksum for $zip in SHA256SUMS.txt" }
          $path = "bucket/deadlock-config-manager.json"
          $m = Get-Content $path -Raw | ConvertFrom-Json
          $m.version = $version
          $m.architecture."64bit".url = "https://github.com/${{ github.repository }}/releases/download/$($env:TAG)/$zip"
          $m.architecture."64bit".hash = $hash
          ($m | ConvertTo-Json -Depth 10) + "`n" | Set-Content -NoNewline -Encoding utf8NoBOM $path
          Remove-Item SHA256SUMS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $path
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: scoop manifest for $($env:TAG)"
            git push
          }

  winget:
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit to winget
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: alzzzik.DeadlockConfigManager
          installers-regex: '_x64-setup\.exe$'
          release-tag: ${{ github.event.release.tag_name || inputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}
