name: Submit a config
description: Suggest a config repo or GameBanana config for the list under Browse.
title: "Config: "
labels: [config]
body:
  - type: input
    id: link
    attributes:
      label: Link
      description: A GitHub repo (github.com/owner/repo) with gameinfo.gi in its root or in top-level folders, or a GameBanana config page (gamebanana.com/mods/…).
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: One or two lines on what the config does and who it's for.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: It's a performance config (gameinfo.gi / video.txt), with no cheats.
          required: true
        - label: I made it, or its licence or author allows it to be listed.
          required: true
