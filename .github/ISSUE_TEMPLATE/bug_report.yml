name: Bug report
description: Something in the app didn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: "**Settings → Copy diagnostics** in the app, then paste here. Your Windows user name is removed."
      render: text
    validations:
      required: false
  - type: input
    id: pack
    attributes:
      label: Config
      description: Config you applied, if any (e.g. alzzzik/alz-deadlock-cfg stable)
